<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kodchaporn | QA Tester CV</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    scroll-behavior:smooth;
}

:root{
    --black:#211720;
    --darkpink:#64233f;
    --wine:#8c3159;
    --pink:#e35491;
    --pink2:#f89fc3;
    --lightpink:#ffe2ee;
    --cream:#fff9fc;
    --purple:#8d65a6;
    --text:#342a32;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,#ffd6e8 0,transparent 25%),
        radial-gradient(circle at 90% 30%,#e4d5f2 0,transparent 27%),
        linear-gradient(135deg,#fff8fb,#f8edf4,#f4eef9);

    color:var(--text);
    line-height:1.7;
    overflow-x:hidden;
}


/* =========================
   GLITTER BACKGROUND
========================= */

.glitter{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    overflow:hidden;
}

.star{
    position:absolute;
    color:#fff;
    opacity:.75;
    animation:twinkle 3s infinite ease-in-out;
    text-shadow:
        0 0 6px #ff9ac5,
        0 0 12px #d99cff;
}

.star:nth-child(1){left:8%;top:12%;font-size:18px;}
.star:nth-child(2){left:88%;top:17%;font-size:12px;animation-delay:.8s;}
.star:nth-child(3){left:18%;top:50%;font-size:13px;animation-delay:1.5s;}
.star:nth-child(4){left:92%;top:60%;font-size:19px;animation-delay:.4s;}
.star:nth-child(5){left:5%;top:82%;font-size:14px;animation-delay:2s;}
.star:nth-child(6){left:75%;top:90%;font-size:12px;animation-delay:1s;}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.7) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.25) rotate(15deg);
    }
}


/* =========================
   NAVIGATION
========================= */

.nav{
    position:sticky;
    top:15px;
    z-index:50;

    width:92%;
    max-width:1000px;

    margin:18px auto;

    background:rgba(35,22,32,.88);

    backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,.17);

    border-radius:50px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:9px 14px 9px 18px;

    box-shadow:0 12px 30px rgba(77,28,53,.18);
}

.nav-logo{
    font-weight:900;
    color:#ffd5e7;
    letter-spacing:2px;
}

.nav-links{
    display:flex;
    gap:5px;
}

.nav a{
    color:#fff;
    text-decoration:none;

    font-size:13px;

    padding:8px 13px;

    border-radius:30px;

    transition:.25s;
}

.nav a:hover{
    background:#e0528c;
}


/* =========================
   MAIN
========================= */

.container{
    width:92%;
    max-width:1000px;
    margin:auto;
}


/* =========================
   HERO
========================= */

.hero{
    position:relative;
    overflow:hidden;

    min-height:430px;

    border-radius:35px;

    display:flex;
    align-items:center;

    padding:55px;

    color:#fff;

    background:
        linear-gradient(
            120deg,
            #21171f 0%,
            #4d2037 32%,
            #8f315a 68%,
            #df548d 100%
        );

    box-shadow:
        0 25px 60px rgba(89,29,59,.30);
}


/* dotted decoration */

.hero-grid{
    position:absolute;
    inset:0;

    opacity:.15;

    background-image:
        radial-gradient(#fff 1px,transparent 1px);

    background-size:20px 20px;
}


/* glow */

.hero-glow{
    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    right:-120px;
    top:-160px;

    background:
        radial-gradient(circle,
        rgba(255,218,234,.45),
        transparent 65%);
}


/* decorative hearts/stars */

.decor{
    position:absolute;

    color:rgba(255,255,255,.24);

    font-size:45px;
}

.decor.one{
    right:70px;
    bottom:50px;
}

.decor.two{
    right:190px;
    top:55px;

    font-size:25px;
}


/* PROFILE */

.profile-wrap{
    position:relative;
    z-index:3;
    flex-shrink:0;
}

.profile-img{
    width:210px;
    height:210px;

    object-fit:cover;

    border-radius:45% 55% 48% 52% / 52% 45% 55% 48%;

    border:6px solid #ffd8e8;

    box-shadow:
        0 0 0 8px rgba(255,255,255,.10),
        0 20px 40px rgba(0,0,0,.30);

    animation:morph 7s ease-in-out infinite;
}

@keyframes morph{
    0%,100%{
        border-radius:45% 55% 48% 52% / 52% 45% 55% 48%;
    }

    50%{
        border-radius:55% 45% 54% 46% / 44% 55% 45% 56%;
    }
}


/* HERO TEXT */

.hero-info{
    position:relative;
    z-index:3;

    margin-left:45px;
}

.logo-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.30);

    backdrop-filter:blur(10px);

    padding:7px 16px;

    border-radius:30px;

    font-size:13px;
    font-weight:800;

    letter-spacing:2px;

    color:#ffd5e7;

    margin-bottom:15px;
}

.hero h1{
    font-size:52px;
    line-height:1.05;
    letter-spacing:1px;
}

.hero-job{
    margin-top:17px;

    font-size:23px;
    font-weight:800;

    letter-spacing:4px;

    color:#ffc1da;
}

.hero-sub{
    margin-top:3px;

    letter-spacing:2px;

    color:#f7d9e6;
}

.hero-description{
    margin-top:17px;

    max-width:520px;

    color:#f8eaf0;
}


/* BUTTONS */

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;

    margin-top:23px;
}

.btn{
    border:none;
    cursor:pointer;

    padding:11px 20px;

    border-radius:30px;

    font-weight:700;

    transition:.25s;

    text-decoration:none;
}

.btn-primary{
    background:#ffd0e2;
    color:#742647;
}

.btn-secondary{
    color:#fff;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.35);
}

.btn:hover{
    transform:translateY(-3px);

    box-shadow:0 8px 18px rgba(0,0,0,.17);
}


/* =========================
   SECTIONS
========================= */

.card{
    position:relative;

    margin-top:28px;

    padding:38px;

    background:rgba(255,255,255,.84);

    border:1px solid rgba(224,157,187,.45);

    backdrop-filter:blur(13px);

    border-radius:27px;

    box-shadow:
        0 12px 35px rgba(102,48,72,.08);

    transition:.3s;
}

.card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 18px 40px rgba(102,48,72,.12);
}

.card::before{
    content:"";

    position:absolute;

    top:0;
    left:40px;

    width:75px;
    height:4px;

    background:
        linear-gradient(
            90deg,
            #d94d85,
            #9a5ea7
        );

    border-radius:0 0 10px 10px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;

    color:#8d315b;

    font-size:25px;

    margin-bottom:22px;

    padding-bottom:12px;

    border-bottom:1px solid #eed6e0;
}

.section-icon{
    width:36px;
    height:36px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(135deg,#f9c7da,#e0c5ed);
}


/* =========================
   PERSONAL INFO
========================= */

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}

.info-item{
    padding:17px 19px;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #fff9fc,
            #fbeaf2
        );

    border:1px solid #f0ccd9;

    transition:.25s;
}

.info-item:hover{
    transform:translateY(-3px);

    border-color:#df80a6;
}

.info-label{
    display:block;

    font-size:11px;
    font-weight:800;

    color:#ae587c;

    letter-spacing:1.3px;

    margin-bottom:3px;
}


/* =========================
   SKILLS
========================= */

.skill-cloud{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.skill-pill{
    padding:9px 17px;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #ffe1ec,
            #e9d6f2
        );

    border:1px solid #edbad0;

    color:#642443;

    font-weight:700;

    transition:.25s;
}

.skill-pill:hover{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #71304f,
            #dd5088
        );

    transform:
        translateY(-3px)
        rotate(-1deg);
}


/* =========================
   SKILL METERS
========================= */

.skill-row{
    margin:17px 0;
}

.skill-top{
    display:flex;
    justify-content:space-between;

    margin-bottom:7px;

    font-weight:700;
}

.bar{
    height:10px;

    background:#f1e4ea;

    border-radius:50px;

    overflow:hidden;
}

.bar span{
    display:block;

    height:100%;

    border-radius:50px;

    background:
        linear-gradient(
            90deg,
            #8d315a,
            #ef699e,
            #a77bc1
        );

    animation:grow 1.5s ease;
}

@keyframes grow{
    from{width:0;}
}


/* =========================
   EDUCATION TIMELINE
========================= */

.timeline{
    position:relative;

    margin-left:9px;

    padding-left:32px;

    border-left:3px solid #e38caf;
}

.timeline-item{
    position:relative;

    margin-bottom:30px;
}

.timeline-item::before{
    content:"✦";

    position:absolute;

    left:-45px;
    top:-2px;

    width:24px;
    height:24px;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:#fff;

    color:#c74478;

    box-shadow:
        0 0 0 5px #f8d7e5;
}

.year{
    font-weight:900;
    color:#c34478;
}


/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;

    border-collapse:separate;
    border-spacing:0;

    border-radius:18px;

    overflow:hidden;

    border:1px solid #eccbd8;
}

th{
    padding:15px;

    color:#fff;

    text-align:left;

    background:
        linear-gradient(
            120deg,
            #38202d,
            #823253,
            #d34e83
        );
}

    padding:14px;

    background:#fffafb;

    border-bott
